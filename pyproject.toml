[project]
name = "practiceapp"
version = "0.1.0"
description = "Interview Practice Studio: a Streamlit app for preparing for job interviews"
readme = "README.md"
authors = [
    { name = "scanyameres", email = "scanyameres@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "openai>=3.30.0",
    "IPython",
    "tiktoken",
    "streamlit",
    "streamlit-authenticator>=0.4.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
