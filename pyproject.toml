[project]
name = "scanya-ae-afa-updated0209-1-6"
version = "0.1.0"
description = "Interview practice app built with Streamlit and the OpenRouter API"
readme = "README.md"
authors = [
    { name = "scanyameres", email = "scanyameres@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openai>=3.45.0",
    "pydantic>=2.14.2",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
    "streamlit-authenticator>=0.4.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
